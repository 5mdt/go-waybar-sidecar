name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test GO=go

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              make build GO=go BIN=go-waybar-sidecar-linux-$arch
          done
          cd build && sha256sum go-waybar-sidecar-linux-* > sha256sums.txt

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v t="# $GITHUB_REF_NAME" '/^# /{p = ($0 == t); next} p' docs/CHANGELOG.md > notes.md
          test -s notes.md || { echo "no $GITHUB_REF_NAME section in docs/CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" build/* --notes-file notes.md

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/* --prerelease \
            --target "$GITHUB_SHA" --title "latest (main)" \
            --notes "Built from $GITHUB_SHA"
