sidecar:
  log-level: info
  log-output: stdout
  notify-level: error
  no-generate: false
  daemon: false

# jobs:
#   - name: example
#     every: 5m              # or: schedule: "*/5 * * * *"
#     command: "echo hello"
#     output: ~/.cache/waybar/example  # optional stdout capture

waybar:
  layer: top
  position: top
  modules-left: [custom/Start]
  modules-right: [clock]
  modules-center: [wlr/taskbar]

  custom/Start:
    format: "󰨡 Start"
    menu: on-click
    menu_definition:
      - name: Apps
        children:
          # - include: applications:plain   # all *.desktop apps, alphabetical
          # - include: applications:categories   # per-category submenus; mode: all|first
          - name: Terminal
            action: "foot"
          - name: Browser
            action: "firefox"
          - name: "---"          # separator line
          - name: Files
            action: "nautilus"
      - name: Power
        children:
          # - include: power-profiles:plain   # power-saver/balanced/performance, active one bold
          # - include: session-actions:plain   # lock/logout/suspend/reboot/shutdown, only available ones
          - name: Shutdown
            action: "systemctl poweroff"
          - name: Reboot
            action: "systemctl reboot"

  clock:
    format: "{:%H:%M}"
  wlr/taskbar:
    format: "{icon}"
